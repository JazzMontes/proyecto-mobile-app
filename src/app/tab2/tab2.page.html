<ion-content [fullscreen]="true" class="profile-page">

  <div class="perfil-container">

    <div class="perfil-card">

      <div class="perfil-header">
        <div class="avatar">
          {{ inicial }}
        </div>

        <h1>Mi Perfil</h1>
        <p>Información de tu cuenta</p>
      </div>

      <div class="perfil-info">

        <div class="info-item">
          <span class="info-label">Nombre</span>
          <span class="info-value">{{ nombre }}</span>
        </div>

        <div class="info-item">
          <span class="info-label">Usuario</span>
          <span class="info-value">{{ usuario }}</span>
        </div>

        <div class="info-item">
          <span class="info-label">Correo</span>
          <span class="info-value">{{ correo }}</span>
        </div>

        <div class="info-item">
          <span class="info-label">Estado</span>

          <span
            class="estado"
            [class.activo]="estado === 'Activo'"
          >
            {{ estado }}
          </span>
        </div>

      </div>

      <div class="perfil-footer">
        <button
          type="button"
          class="boton-cerrar"
          (click)="cerrarSesion()"
        >
          Cerrar sesión
        </button>
      </div>

    </div>

  </div>

</ion-content>
